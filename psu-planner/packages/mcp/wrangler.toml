# The hosted connector (#33).
#
# Catalog as STATIC ASSETS, not bundled into the script. The audit index
# alone is 2 MB and the subject files another 12, which no Worker script
# limit accommodates — and bundling them would also mean parsing
# everything to answer anything. As assets they are fetched per path, on
# demand, by `FetchCatalogSource`.
#
# `binding` rather than a public route: the catalog is read by this
# Worker, not served to the internet. `assets.directory` is the tree
# `scripts/sync-catalog.mjs` writes.

name = "lionsdegree-mcp"
main = "src/worker.ts"
compatibility_date = "2026-10-01"

# `nodejs_compat` for the SDK's few Node built-in imports on paths this
# Worker does not take (the stdio transport, mostly). Without it the
# bundler fails on the import graph rather than at runtime.
compatibility_flags = ["nodejs_compat"]

# ONE ADDRESS, AND ONLY ONE. Adding the route below makes wrangler ask
# what should happen to the two other hostnames a Worker gets for free,
# because it will not change them silently. Both are turned off, and the
# reason is the same for each: they serve the same connector, with the
# same KV namespaces and the same secrets, on a hostname nobody vetted.
#
# `workers_dev` — lionsdegree-mcp.<account>.workers.dev. A second door
# to a student's degree plan, and one that cannot complete a sign-in:
# Supabase allows exactly one callback URL and it is the custom
# domain's, so a flow started there dies halfway with a rejection the
# student cannot act on. A working-looking address that cannot work is
# worse than no address.
#
# `preview_urls` — a hostname per uploaded version. Same bindings, same
# rate-limit counters, same revocation denylist, and no announcement
# when one appears. For a service whose security model is "one
# registered redirect URL", an unbounded set of hostnames serving it is
# not a convenience.
#
# The cost is real and accepted: no fallback address while the
# certificate is issuing, and no per-version preview to click. Nothing
# is published until the custom domain answers anyway.
#
# These are TOP-LEVEL keys and must stay above the first [[routes]]
# header — inside it, TOML reads them as route fields and wrangler
# rejects the file.
workers_dev = false
preview_urls = false

# THE PUBLISHED ADDRESS (#38). A bare hostname with NO PATH, because
# /mcp is not the whole connector: discovery, dynamic client
# registration, /authorize, /callback and /token all live on this host,
# and a route matching only the endpoint would drop a student at a 404
# in the middle of signing in. The handler owns its own 404 for
# everything else.
#
# `custom_domain` takes a hostname and nothing more — a pattern with a
# path is rejected, and the `host/*` spelling needs a zone id this file
# does not carry.
#
# `custom_domain` makes Cloudflare issue and renew the certificate and
# create the DNS record, which is why there is no separate CNAME to keep
# in step with this file.
#
# apps/web/test/connect-address.test.ts asserts this hostname against the
# one /connect/ tells students to paste. That test exists because the
# page published a hostname that did not resolve, on a transport the
# server never spoke, for months — with nothing comparing the two.
[[routes]]
pattern = "mcp.lionsdegree.com"
custom_domain = true


[assets]
directory = "./catalog"
binding = "CATALOG"
# THE WORKER OWNS ITS ROUTING. Without this, Cloudflare serves a matching
# asset BEFORE the handler runs, so `/2026-2027/courses/math.json` was
# answered from the bucket and the handler's 404 was never reached — the
# endpoint's public surface was whatever the catalog tree happened to
# contain rather than a decision.
#
# Nothing was leaking: the shipped files carry no Bulletin prose
# (sync-catalog refuses to build otherwise, DECISIONS.md 5.1) and the
# same files are already public on lionsdegree.com. But a connector
# should answer only what it means to, and the test asserting "/anything
# is a 404" was passing only because no asset happened to sit there.
run_worker_first = true

# Registered assistants, authorization codes, the revocation denylist,
# and the last self-check report. Everything here is short-lived except
# a registered client, and nothing is a student's Plan. (Rate-limit
# counters have their own namespace, below.)
#
[[kv_namespaces]]
binding = "OAUTH"
id = "9253a3a7bc10447d92b401e7b0d771b9"

[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "12cf7229b8524d95bed03c77ec908325"

# SECRETS, never in this file:
#   npx wrangler secret put SUPABASE_JWT_SECRET   # Supabase → Settings → API → JWT Secret
#   npx wrangler secret put SUPABASE_ANON_KEY     # public by design, but it is config, not code
#
# And in Supabase → Authentication → URL Configuration, add this
# Worker's /callback to the allowed redirect URLs, or the sign-in hop
# comes back rejected.

[vars]
SUPABASE_URL = "https://bjwjfmqcmbcnnzqnabqm.supabase.co"
# Questions per student per day. Generous: this stops one person
# exhausting the service, it does not ration anybody.
RATE_LIMIT_PER_DAY = "1000"

# THE SELF-CHECK (#38). Every fifteen minutes the Worker answers a real
# Course question against the real catalog and logs loudly if it cannot
# — so the first person to notice the connector is broken is not a
# student mid-question. `/health` reports what the last run found.
#
# Fifteen minutes is the gap a student might hit. It is not free: a cron
# gets a cold isolate, so each run pays a full edition load — six asset
# reads and a couple of megabytes of parsing, ninety-six times a day.
# That is the price of a check that proves the connector ANSWERS rather
# than that it booted, and the failures this service has actually had
# were all of the first kind.
[triggers]
crons = ["*/15 * * * *"]

[observability]
enabled = true

[placement]
mode = "smart"
