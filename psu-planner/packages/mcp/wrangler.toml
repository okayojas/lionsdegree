# The hosted connector (#33).
#
# Catalog as STATIC ASSETS, not bundled into the script. The audit index
# alone is 2 MB and the subject files another 12, which no Worker script
# limit accommodates — and bundling them would also mean parsing
# everything to answer anything. As assets they are fetched per path, on
# demand, by `FetchCatalogSource`.
#
# `binding` rather than a public route: the catalog is read by this
# Worker, not served to the internet. `assets.directory` is the tree
# `scripts/sync-catalog.mjs` writes.

name = "lionsdegree-mcp"
main = "src/worker.ts"
compatibility_date = "2026-10-01"

# `nodejs_compat` for the SDK's few Node built-in imports on paths this
# Worker does not take (the stdio transport, mostly). Without it the
# bundler fails on the import graph rather than at runtime.
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./catalog"
binding = "CATALOG"
# THE WORKER OWNS ITS ROUTING. Without this, Cloudflare serves a matching
# asset BEFORE the handler runs, so `/2026-2027/courses/math.json` was
# answered from the bucket and the handler's 404 was never reached — the
# endpoint's public surface was whatever the catalog tree happened to
# contain rather than a decision.
#
# Nothing was leaking: the shipped files carry no Bulletin prose
# (sync-catalog refuses to build otherwise, DECISIONS.md 5.1) and the
# same files are already public on lionsdegree.com. But a connector
# should answer only what it means to, and the test asserting "/anything
# is a 404" was passing only because no asset happened to sit there.
run_worker_first = true

[observability]
enabled = true

[placement]
mode = "smart"
