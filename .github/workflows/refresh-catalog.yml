# Re-scrape bulletins.psu.edu and open a PR with the new catalog.
#
# WHY A PR AND NOT A DIRECT PUSH: the catalog is the app's source of truth, and
# a partial or malformed scrape degrades every plan silently (see DECISIONS.md
# iron rule 2 -- unparseable must never render as falsely-satisfied). The PR
# runs CI (engine tests execute against the committed catalog) and prints a
# diff summary, so a bad edition is caught before it reaches users. Merge is
# one click; enable auto-merge on the PR if you want it fully hands-off.
#
# CADENCE: Penn State publishes the new bulletin edition over the summer. This
# runs in the last week of August and the first week of January, matching the
# manual cadence the project has used since 2026.
name: Refresh catalog

on:
  schedule:
    # 06:00 UTC, Aug 25 and Jan 5.
    - cron: "0 6 25 8 *"
    - cron: "0 6 5 1 *"
  workflow_dispatch:
    inputs:
      edition:
        description: 'Bulletin edition, e.g. 2026-2027. Blank = pipeline default.'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    # A full crawl is ~25-40 min at 1 req/s, plus the Playwright AP pass.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install pipeline deps
        working-directory: psu-catalog-pipeline
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Resolve edition
        id: ed
        run: |
          ED="${{ inputs.edition }}"
          if [ -z "$ED" ]; then
            # Academic editions roll in the summer: before July, we are still on
            # (year-1)-(year); from July on, the new (year)-(year+1) is live.
            Y=$(date -u +%Y); M=$(date -u +%m)
            if [ "$M" -ge 07 ]; then ED="${Y}-$((Y+1))"; else ED="$((Y-1))-${Y}"; fi
          fi
          echo "edition=$ED" >> "$GITHUB_OUTPUT"
          echo "Using edition $ED"

      - name: Scrape
        working-directory: psu-catalog-pipeline
        env:
          EDITION: ${{ steps.ed.outputs.edition }}
        run: |
          npx tsx src/cli.ts scrape --edition "$EDITION"
          npx tsx scripts/buildIndex.ts --edition "$EDITION"
          npx tsx scripts/scrapeIug.ts --edition "$EDITION"
          npx tsx scripts/scrapeApCredits.ts --edition "$EDITION"
          # The optimizer priors are mined from the Engineering advising
          # flowcharts, which are NOT in the repo (see NOTICE). The committed
          # data/flowcharts/parsed.json is enough to re-mine them; if it is
          # missing we keep the existing flowchart-patterns.json rather than
          # emit an empty prior, which would flatten every generated plan.
          if [ -f data/flowcharts/parsed.json ]; then
            npx tsx scripts/mineFlowchartPatterns.ts --edition "$EDITION"
          else
            echo "::warning::flowcharts/parsed.json missing - keeping existing priors"
            mkdir -p "data/out/$EDITION"
            cp ../psu-planner/apps/web/public/catalog/flowchart-patterns.json                "data/out/$EDITION/flowchart-patterns.json"
          fi

      # ADDITIVE: the new edition lands in public/catalog/<edition>/ alongside
      # the ones already committed. Editions ship forward-only because Penn
      # State's archive is robots-disallowed, so an edition dropped here can
      # never be re-fetched (docs/adr/0001-forward-only-catalog-editions.md).
      # An earlier version of sync-catalog.mjs deleted the whole catalog first,
      # which would have silently re-planned every continuing student.
      - name: Sync into the app
        working-directory: psu-planner
        env:
          EDITION: ${{ steps.ed.outputs.edition }}
        run: |
          pnpm install --frozen-lockfile
          BEFORE=$(ls -d apps/web/public/catalog/*/ 2>/dev/null | wc -l)
          node apps/web/scripts/sync-catalog.mjs "$EDITION"
          AFTER=$(ls -d apps/web/public/catalog/*/ 2>/dev/null | wc -l)
          if [ "$AFTER" -lt "$BEFORE" ]; then
            echo "::error::catalog lost an edition ($BEFORE -> $AFTER); refusing to continue"
            exit 1
          fi

      # Gate: the plan-generation and flowchart-validation suites run against
      # the freshly synced catalog. If the new edition broke a parser, this
      # fails and no PR is opened.
      - name: Validate against the new catalog
        working-directory: psu-planner
        run: pnpm -r test

      - name: Summarize the diff
        id: diff
        run: |
          ADDED=$(git status --porcelain psu-planner/apps/web/public/catalog | grep -c '^??' || true)
          CHANGED=$(git status --porcelain psu-planner/apps/web/public/catalog | grep -c '^ M' || true)
          DELETED=$(git status --porcelain psu-planner/apps/web/public/catalog | grep -c '^ D' || true)
          EDITIONS=$(ls -d psu-planner/apps/web/public/catalog/*/ 2>/dev/null \
            | xargs -n1 basename | paste -sd', ' -)
          {
            echo "summary<<EOF"
            echo "- Edition scraped: \`${{ steps.ed.outputs.edition }}\`"
            echo "- Editions now published: \`$EDITIONS\`"
            echo "- Catalog files added: $ADDED"
            echo "- Catalog files changed: $CHANGED"
            echo "- Catalog files removed: $DELETED"
            echo ""
            echo "A non-zero \"removed\" count outside the scraped edition's own"
            echo "directory means an edition was dropped. Editions are"
            echo "forward-only and the archive is robots-disallowed, so a"
            echo "dropped edition cannot be recovered from Penn State -- only"
            echo "from this repository's git history. Do not merge if so."
            echo ""
            echo "Engine tests passed against this catalog before the PR was opened."
            echo "Review \`manifest.json\` for the new counts, and skim"
            echo "\`review/needs_review.jsonl\` for a jump in unstructured rows --"
            echo "a large jump usually means a bulletin markup change broke a parser."
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Open PR
        uses: peter-evans/create-pull-request@v7
        with:
          branch: catalog/${{ steps.ed.outputs.edition }}
          title: "Catalog refresh: ${{ steps.ed.outputs.edition }}"
          commit-message: "Catalog refresh: ${{ steps.ed.outputs.edition }}"
          body: ${{ steps.diff.outputs.summary }}
          labels: catalog, automated
          add-paths: |
            psu-planner/apps/web/public/catalog/**
