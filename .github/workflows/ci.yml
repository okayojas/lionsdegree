name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  app:
    name: engine + web + api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: psu-planner/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: psu-planner
      - run: pnpm -r typecheck
        working-directory: psu-planner
      # BUILD FIRST. The web suite asserts properties of dist -- that the
      # landing page ships no planner bundle, that the worker is scoped to
      # /plan/ -- and deliberately fails rather than skipping when dist is
      # absent, so it cannot run before the build exists.
      - run: pnpm --filter web build
        working-directory: psu-planner
      # The engine tests read the catalog committed under
      # apps/web/public/catalog, so a bad catalog refresh fails here.
      - run: pnpm -r test
        working-directory: psu-planner

  # SEPARATE JOB. It starts a browser and is measured in minutes, where the
  # suite above is seconds. Keeping them apart means a failure here does not
  # delay the fast feedback, and the fast feedback does not wait on a browser
  # download.
  browser:
    name: accessibility + layout (browser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: psu-planner/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: psu-planner

      # The browser is ~120 MB. Cached on the resolved Playwright version, so
      # the download happens once per version bump rather than once per run.
      - name: Resolve the Playwright version
        id: pw
        run: echo "version=$(node -p "require('./apps/web/node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
        working-directory: psu-planner
      - uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - run: pnpm --filter web exec playwright install --with-deps chromium
        working-directory: psu-planner
        if: steps.pw-cache.outputs.cache-hit != 'true'
      # System deps are not in the cached path, so they are installed either way.
      - run: pnpm --filter web exec playwright install-deps chromium
        working-directory: psu-planner
        if: steps.pw-cache.outputs.cache-hit == 'true'

      # SYNC HAS TO BE CONFIGURED FOR THE CONFLICT SUITE TO MEAN ANYTHING.
      #
      # `.env.local` is gitignored, so CI built with no Supabase values and
      # `syncConfigured` false. Nothing then pushes, nothing is refused, and
      # the conflict bar cannot render -- so all nine of plan-conflict's
      # tests asserted a banner the build was incapable of showing, and the
      # browser job had been red on that since 2026-10-31 while every
      # developer's machine stayed green.
      #
      # THESE VALUES POINT NOWHERE ON PURPOSE. Both specs stub `/auth/v1/**`
      # and `/rest/v1/plans**` at the Playwright layer, so the build only has
      # to BELIEVE sync exists; no request is meant to leave the browser.
      # A host that does not resolve is the safety property -- the real
      # project's anon key is public (it ships in the bundle), so using it
      # would work too, and would point CI at production data the moment a
      # route stub failed to match. That trade is not worth taking.
      #
      # Measured before trusting it: the whole suite under exactly these
      # values ran 749 passed / 32 skipped / 0 failed in 323s, against a
      # 320s baseline on real values. Booting every other spec with sync
      # "on" against a dead host cost nothing and flaked nothing.
      - name: Point the build at a Supabase that does not exist
        run: |
          cat > apps/web/.env.local <<'ENVEOF'
          VITE_SUPABASE_URL=https://ci-stub.supabase.co
          VITE_SUPABASE_ANON_KEY=ci-stub-anon-key-not-a-real-key
          ENVEOF
        working-directory: psu-planner

      # Runs against the BUILT app: the launch gate is about what ships.
      - run: pnpm --filter web build
        working-directory: psu-planner
      - run: pnpm test:e2e
        working-directory: psu-planner
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: psu-planner/apps/web/playwright-report
          retention-days: 7

  pipeline:
    name: scraper parser regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
        working-directory: psu-catalog-pipeline
      - run: npm test
        working-directory: psu-catalog-pipeline
      - run: npm run typecheck
        working-directory: psu-catalog-pipeline
